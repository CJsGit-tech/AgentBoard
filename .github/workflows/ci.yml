name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-checks.txt
      - run: python scripts/check-skills.py
      - run: python -m unittest discover -s scripts/tests -v
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated executor and host setup contracts
        run: PYTHONPATH=backend python3 -m unittest discover -s backend/tests -p test_assistant_workspace.py -v
      - name: Generate local credentials and start the API
        run: |
          mkdir -p .local
          umask 077
          openssl rand -hex 32 > .local/db_password
          # On Linux the mounted secret keeps its file mode, and the API runs as another user.
          # This throwaway password exists only on the temporary runner.
          chmod 644 .local/db_password
          docker compose up --build -d --wait db api
      - name: Run isolated database and MCP contract tests
        run: docker compose exec -T api python -m unittest discover -s tests -v
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color api db
      - name: Stop CI services
        if: always()
        run: docker compose down --volumes

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
