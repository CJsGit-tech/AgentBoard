<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc"><title id="title">AgentBoard module architecture</title><desc id="desc">Local browser and external Codex or Claude clients connect to web and FastAPI containers. Five aligned modules share approval and Postgres services. Activity expires after 30 days; document history retains three previous versions.</desc><style>text{font-family:Arial,sans-serif;fill:#243240}.small{font-size:12px;fill:#546370}.label{font-size:13px}.heading{font-size:15px;font-weight:bold}.line{stroke:#687b8d;stroke-width:1.4;fill:none}.arrow{stroke:#687b8d;stroke-width:1.4;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#687b8d"/></marker></defs><rect width="1500" height="1120" fill="#fff"/><text x="28" y="29" class="heading" text-anchor="start">AgentBoard · Module Architecture · Draft v0.1.1</text><rect x="55" y="46" width="350" height="58" rx="7" fill="#f1f3f5" stroke="#9aa6b2"/><text x="230" y="69" class="label" text-anchor="middle">Personal browser · one builder</text><text x="230" y="90" class="small" text-anchor="middle">React views + live activity</text><rect x="525" y="46" width="445" height="58" rx="7" fill="#f1f3f5" stroke="#9aa6b2"/><text x="747" y="69" class="label" text-anchor="middle">Codex desktop / CLI · Claude Code / Desktop</text><text x="747" y="90" class="small" text-anchor="middle">Independent clients · HTTP / optional stdio bridge</text><rect x="1110" y="46" width="360" height="58" rx="7" fill="#f1f3f5" stroke="#9aa6b2"/><text x="1290" y="69" class="label" text-anchor="middle">Local configuration / credentials</text><text x="1290" y="90" class="small" text-anchor="middle">DB · client pairing · retention · allowed origin</text><rect x="25" y="139" width="1450" height="839" rx="7" fill="none" stroke="#8e9cab" stroke-dasharray="7 5"/><text x="42" y="158" class="heading" text-anchor="start">Personal computer · Docker Compose network</text><rect x="40" y="175" width="1420" height="174" rx="7" fill="none" stroke="#9aa6b2"/><text x="56" y="195" class="heading" text-anchor="start">web container · React / Vite static build + reverse proxy</text><text x="1444" y="195" class="small" text-anchor="end">127.0.0.1:8080 only published port</text><rect x="60" y="214" width="260" height="53" rx="7" fill="#e6f0fa" stroke="#7aa5d2"/><text x="190" y="235" class="heading" text-anchor="middle">1. Projects</text><text x="190" y="255" class="small" text-anchor="middle">Purpose · project list</text><rect x="340" y="214" width="260" height="53" rx="7" fill="#e6f0fa" stroke="#7aa5d2"/><text x="470" y="235" class="heading" text-anchor="middle">2. Agent Roles</text><text x="470" y="255" class="small" text-anchor="middle">Responsibilities · owners</text><rect x="620" y="214" width="260" height="53" rx="7" fill="#e6f0fa" stroke="#7aa5d2"/><text x="750" y="235" class="heading" text-anchor="middle">3. Tickets</text><text x="750" y="255" class="small" text-anchor="middle">Priority · state · approval badge</text><rect x="900" y="214" width="260" height="53" rx="7" fill="#e6f0fa" stroke="#7aa5d2"/><text x="1030" y="235" class="heading" text-anchor="middle">4. Documents</text><text x="1030" y="255" class="small" text-anchor="middle">Editor · compare · restore</text><rect x="1180" y="214" width="260" height="53" rx="7" fill="#e6f0fa" stroke="#7aa5d2"/><text x="1310" y="235" class="heading" text-anchor="middle">5. Activity &amp; Progress</text><text x="1310" y="255" class="small" text-anchor="middle">Labels · filters · live feed</text><rect x="60" y="288" width="535" height="42" rx="7" fill="#e6f0fa" stroke="#7aa5d2"/><text x="327" y="314" class="label" text-anchor="middle">Browser session · unsaved drafts · SSE reconnect</text><rect x="620" y="288" width="820" height="42" rx="7" fill="#e6f0fa" stroke="#7aa5d2"/><text x="1030" y="314" class="label" text-anchor="middle">Proxy: /api/v1 · /mcp · /events (streaming, no buffering)</text><path d="M230 104V174" class="arrow"/><text x="245" y="129" class="small" text-anchor="start">HTTP</text><path d="M747 104V126H1487V309H1441" class="arrow"/><text x="1060" y="129" class="small" text-anchor="start">MCP /mcp</text><path d="M1290 104V138" class="arrow dash"/><text x="1305" y="126" class="small" text-anchor="start">Startup settings</text><rect x="40" y="377" width="1420" height="455" rx="7" fill="none" stroke="#9aa6b2"/><text x="56" y="397" class="heading" text-anchor="start">backend container · Python / FastAPI</text><text x="1444" y="397" class="small" text-anchor="end">backend:8000 · internal only</text><rect x="60" y="414" width="660" height="43" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="390" y="440" class="label" text-anchor="middle">REST API /api/v1 · live SSE /events</text><rect x="750" y="414" width="690" height="43" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="1095" y="440" class="label" text-anchor="middle">MCP typed tools · negotiated client capabilities</text><path d="M800 330V359H390V413" class="arrow"/><text x="480" y="367" class="small" text-anchor="start">Browser REST / SSE</text><path d="M1200 330V359H1095V413" class="arrow"/><text x="1212" y="367" class="small" text-anchor="start">Agent MCP</text><rect x="60" y="482" width="1380" height="55" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="750" y="503" class="heading" text-anchor="middle">Session / client credentials · project isolation · shared mutation policy</text><text x="750" y="524" class="label" text-anchor="middle">Agent Create / Read: allowed   |   Update / Delete: verified client approval or no execution</text><path d="M390 457V481" class="arrow"/><path d="M1095 457V481" class="arrow"/><rect x="60" y="568" width="260" height="155" rx="7" fill="#f6f7f8" stroke="#9aa6b2"/><text x="190" y="590" class="heading" text-anchor="middle">1. Projects</text><rect x="68" y="603" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="190" y="622" class="small" text-anchor="middle">Create / read projects</text><rect x="68" y="638" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="190" y="657" class="small" text-anchor="middle">Update / delete via policy</text><rect x="68" y="673" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="190" y="692" class="small" text-anchor="middle">Project-bound records</text><path d="M190 537V567" class="arrow"/><path d="M190 723V748" class="line"/><rect x="340" y="568" width="260" height="155" rx="7" fill="#f6f7f8" stroke="#9aa6b2"/><text x="470" y="590" class="heading" text-anchor="middle">2. Agent Roles</text><rect x="348" y="603" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="470" y="622" class="small" text-anchor="middle">Role definitions</text><rect x="348" y="638" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="470" y="657" class="small" text-anchor="middle">Task ownership</text><rect x="348" y="673" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="470" y="692" class="small" text-anchor="middle">No process execution</text><path d="M470 537V567" class="arrow"/><path d="M470 723V748" class="line"/><rect x="620" y="568" width="260" height="155" rx="7" fill="#f6f7f8" stroke="#9aa6b2"/><text x="750" y="590" class="heading" text-anchor="middle">3. Tickets</text><rect x="628" y="603" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="750" y="622" class="small" text-anchor="middle">Tasks / blockers / owners</text><rect x="628" y="638" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="750" y="657" class="small" text-anchor="middle">Pending mutation requests</text><rect x="628" y="673" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="750" y="692" class="small" text-anchor="middle">Separate Needs approval badge</text><path d="M750 537V567" class="arrow"/><path d="M750 723V748" class="line"/><rect x="900" y="568" width="260" height="155" rx="7" fill="#f6f7f8" stroke="#9aa6b2"/><text x="1030" y="590" class="heading" text-anchor="middle">4. Documents</text><rect x="908" y="603" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="1030" y="622" class="small" text-anchor="middle">Postgres document content</text><rect x="908" y="638" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="1030" y="657" class="small" text-anchor="middle">Current + 3 prior versions</text><rect x="908" y="673" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="1030" y="692" class="small" text-anchor="middle">Agent-readable history / diff</text><path d="M1030 537V567" class="arrow"/><path d="M1030 723V748" class="line"/><rect x="1180" y="568" width="260" height="155" rx="7" fill="#f6f7f8" stroke="#9aa6b2"/><text x="1310" y="590" class="heading" text-anchor="middle">5. Activity &amp; Progress</text><rect x="1188" y="603" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="1310" y="622" class="small" text-anchor="middle">Agent / ticket / action / time</text><rect x="1188" y="638" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="1310" y="657" class="small" text-anchor="middle">Observed vs reported labels</text><rect x="1188" y="673" width="244" height="28" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="1310" y="692" class="small" text-anchor="middle">30-day activity queries</text><path d="M1310 537V567" class="arrow"/><path d="M1310 723V748" class="line"/><path d="M190 748H1310" class="line"/><rect x="60" y="771" width="1000" height="42" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="560" y="797" class="label" text-anchor="middle">Shared services → SQLAlchemy / psycopg · transactions · revision checks · event writes</text><path d="M560 748V770" class="arrow"/><rect x="1090" y="771" width="350" height="42" rx="7" fill="#fdf1dc" stroke="#d6a550"/><text x="1265" y="797" class="label" text-anchor="middle">Approve in client · no approve tool</text><rect x="40" y="860" width="1015" height="100" rx="7" fill="none" stroke="#9aa6b2"/><text x="56" y="881" class="heading" text-anchor="start">db container · Postgres</text><text x="1038" y="881" class="small" text-anchor="end">db:5432 · internal only</text><rect x="60" y="894" width="975" height="49" rx="7" fill="#e3f4e8" stroke="#6bb184"/><text x="547" y="915" class="label" text-anchor="middle">Projects · roles · tickets · documents / versions · pending approvals · activity</text><text x="547" y="934" class="small" text-anchor="middle">Single canonical database · atomic updates, history bounds, and audit writes</text><path d="M560 813V893" class="arrow"/><text x="574" y="850" class="small" text-anchor="start">SQL transactions</text><rect x="1090" y="860" width="350" height="100" rx="7" fill="#f1f3f5" stroke="#9aa6b2"/><text x="1265" y="884" class="heading" text-anchor="middle">Compose helper services</text><text x="1265" y="908" class="small" text-anchor="middle">migrate: Alembic, before backend</text><text x="1265" y="933" class="small" text-anchor="middle">maintenance: expiry / cleanup</text><path d="M1090 910H1036" class="arrow"/><text x="1081" y="845" class="small" text-anchor="start">Internal DB access</text><rect x="385" y="1005" width="470" height="51" rx="7" fill="#e3f4e8" stroke="#6bb184"/><text x="620" y="1027" class="heading" text-anchor="middle">Docker volume · agentboard_pgdata</text><text x="620" y="1047" class="small" text-anchor="middle">Backups outside volume · bounded local retention</text><path d="M547 943V982H620V1004" class="arrow"/><path d="M45 1083H90" class="arrow"/><text x="100" y="1087" class="small" text-anchor="start">Runtime call / data flow</text><path d="M340 1083H385" class="arrow dash"/><text x="395" y="1087" class="small" text-anchor="start">Startup configuration</text><text x="1455" y="1087" class="small" text-anchor="end">No hosted providers · no agent launch / stop</text></svg>