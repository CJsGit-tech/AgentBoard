<svg xmlns="http://www.w3.org/2000/svg" width="390" height="576" viewBox="0 0 390 576" role="img" aria-labelledby="title desc"><title id="title">One project, two ways to work</title><desc id="desc">You use the browser and coding agents use the skill through MCP. Both share project records.</desc><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="342" height="166" rx="18" fill="#f1eef9"/><g transform="translate(24 23)" stroke="#5148a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="0" y="0" width="28" height="20" rx="4"/><path d="M14 20v6M5 27h18"/></g><text x="24" y="87" fill="#5148a4" font-size="23" font-weight="700">You in the browser</text><text x="24" y="116" fill="#454a50" font-size="17">Plan, read and review</text><text x="316" y="39" text-anchor="end" fill="#5148a4" font-size="13" letter-spacing="1">01</text><rect x="0" y="205" width="342" height="166" rx="18" fill="#edf4fa"/><g transform="translate(24 228)" stroke="#1e5b83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M10 2L0 13l10 11M23 2l10 11-10 11M20 0l-7 27"/></g><text x="24" y="292" fill="#1e5b83" font-size="23" font-weight="700">Your coding agents</text><text x="24" y="321" fill="#454a50" font-size="17">AgentBuild → local MCP</text><text x="316" y="244" text-anchor="end" fill="#1e5b83" font-size="13" letter-spacing="1">02</text><rect x="0" y="410" width="342" height="166" rx="18" fill="#edf5ef"/><g transform="translate(24 433)" stroke="#2d614c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0 7c0-8 32-8 32 0s-32 8-32 0v22c0 8 32 8 32 0V7M0 18c0 8 32 8 32 0"/></g><text x="24" y="497" fill="#2d614c" font-size="23" font-weight="700">One project record</text><text x="24" y="526" fill="#454a50" font-size="17">Requirements → evidence</text><text x="316" y="449" text-anchor="end" fill="#2d614c" font-size="13" letter-spacing="1">SHARED</text><path d="M342 83h30v410h-22m6-6-6 6 6 6M342 288h30" fill="none" stroke="#6e8497" stroke-width="2"/></g></svg>
