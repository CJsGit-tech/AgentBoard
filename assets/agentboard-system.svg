<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc"><title id="title">One project, two ways to work</title><desc id="desc">You use the browser and your coding agents use AgentBuild through MCP. Both share the same project records.</desc><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="25" width="342" height="166" rx="18" fill="#f1eef9"/><g transform="translate(24 48)" stroke="#5148a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="0" y="0" width="28" height="20" rx="4"/><path d="M14 20v6M5 27h18"/></g><text x="24" y="112" fill="#5148a4" font-size="23" font-weight="700">You in the browser</text><text x="24" y="141" fill="#454a50" font-size="17">Plan, read and review</text><text x="316" y="64" text-anchor="end" fill="#5148a4" font-size="13" letter-spacing="1">01</text><rect x="379" y="25" width="342" height="166" rx="18" fill="#edf4fa"/><g transform="translate(403 48)" stroke="#1e5b83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M10 2L0 13l10 11M23 2l10 11-10 11M20 0l-7 27"/></g><text x="403" y="112" fill="#1e5b83" font-size="23" font-weight="700">Your coding agents</text><text x="403" y="141" fill="#454a50" font-size="17">AgentBuild → local MCP</text><text x="695" y="64" text-anchor="end" fill="#1e5b83" font-size="13" letter-spacing="1">02</text><rect x="758" y="25" width="342" height="166" rx="18" fill="#edf5ef"/><g transform="translate(782 48)" stroke="#2d614c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0 7c0-8 32-8 32 0s-32 8-32 0v22c0 8 32 8 32 0V7M0 18c0 8 32 8 32 0"/></g><text x="782" y="112" fill="#2d614c" font-size="23" font-weight="700">One project record</text><text x="782" y="141" fill="#454a50" font-size="17">Requirements → evidence</text><text x="1074" y="64" text-anchor="end" fill="#2d614c" font-size="13" letter-spacing="1">SHARED</text><path d="M171 191v25h758v-19m-6 6 6-6 6 6" fill="none" stroke="#8b80c2" stroke-width="2"/><path d="M729 106h20m-6-6 6 6-6 6" fill="none" stroke="#5386a7" stroke-width="2"/></g></svg>
