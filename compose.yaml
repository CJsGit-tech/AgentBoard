name: agentboard-mvp
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: agentboard
      POSTGRES_USER: agentboard
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [workspace_db:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentboard -d agentboard"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FASTMCP_CHECK_FOR_UPDATES: "off"
      FASTMCP_SHOW_SERVER_BANNER: "false"
      FASTMCP_TELEMETRY_MODE: "off"
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  workspace_db:
    name: agentboard_mvp_workspace_v1
secrets:
  db_password:
    file: ./.local/db_password
