<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">AgentBoard system architecture</title>
  <desc id="desc">A paired browser and external MCP clients connect to the loopback AgentBoard container. FastAPI serves the React build and application endpoints. The backend supports project operations and an opt-in SDK runtime that calls OpenAI and Anthropic. SDK proposals wait for a browser decision before an approved revision-bound change is committed. Postgres persists records on a named Docker volume.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#475b74"/>
    </marker>
    <style>
      text{font-family:system-ui,sans-serif;fill:#17273b}
      .title{font-size:41px;font-weight:730;letter-spacing:-1.3px}
      .heading{font-size:20px;font-weight:700}
      .body{font-size:15px;fill:#47586d}
      .label{font-size:14px;font-weight:650;fill:#354b66}
      .boundary{fill:#f1f5fa;stroke:#9bacc0;stroke-dasharray:7 5}
      .card{fill:white;stroke:#b0c0d1}
      .accent{fill:#e9f0ff;stroke:#7e9ad4}
      .approval{fill:#fff2de;stroke:#c0a06e}
      .storage{fill:#e7f5ee;stroke:#71a791}
      .edge{fill:none;stroke:#475b74;stroke-width:2;marker-end:url(#arrow)}
      .dash{stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1440" height="1040" fill="#fff"/>
  <text x="48" y="70" class="title">AgentBoard system architecture</text>
  <text x="50" y="103" class="body">Local workspace, external MCP clients, and opt-in SDK execution</text>

  <!-- Clients and local deployment boundary -->
  <rect x="76" y="133" width="434" height="91" rx="12" class="card"/>
  <text x="96" y="167" class="heading">Paired browser</text>
  <text x="96" y="194" class="body">Overview · project CRUD · API-mode settings · run review</text>
  <rect x="575" y="133" width="454" height="91" rx="12" class="card"/>
  <text x="595" y="167" class="heading">External Codex and Claude clients</text>
  <text x="595" y="194" class="body">AgentBuild uses authenticated MCP for project records</text>
  <rect x="47" y="251" width="1012" height="687" rx="16" class="boundary"/>
  <text x="78" y="279" class="label">PERSONAL COMPUTER  /  DOCKER COMPOSE</text>
  <path d="M293 224V300" class="edge"/>
  <path d="M804 224V300" class="edge"/>
  <rect x="76" y="301" width="953" height="80" rx="12" class="accent"/>
  <text x="96" y="335" class="heading">AgentBoard container · FastAPI and React build</text>
  <text x="96" y="359" class="body">127.0.0.1:8080 · browser REST and live events · MCP over HTTP</text>
  <path d="M551 381V411" class="edge"/>

  <!-- Application paths -->
  <rect x="76" y="412" width="953" height="310" rx="12" class="card"/>
  <text x="96" y="445" class="heading">Application services · FastAPI</text>
  <text x="96" y="469" class="body">Local browser pairing, origin and CSRF checks · authenticated MCP client identity</text>
  <rect x="96" y="491" width="414" height="105" rx="9" class="accent"/>
  <text x="114" y="519" class="heading">Workspace and MCP services</text>
  <text x="114" y="544" class="body">Projects, roles, tickets, documents, activity and progress</text>
  <text x="114" y="568" class="body">Protected MCP changes use verified client approval</text>
  <rect x="574" y="491" width="432" height="105" rx="9" class="accent"/>
  <text x="592" y="519" class="heading">SDK run service</text>
  <text x="592" y="544" class="body">Workspace toggle · provider readiness · run activity</text>
  <text x="592" y="568" class="body">Codex SDK and Claude Agent SDK · server-side keys</text>
  <rect x="574" y="628" width="432" height="72" rx="9" class="approval"/>
  <text x="592" y="655" class="heading">In-app human approval</text>
  <text x="592" y="680" class="body">Exact proposal and base revision · approve or decline</text>
  <path d="M790 597V627" class="edge"/>
  <text x="804" y="619" class="label">Pending proposal</text>
  <text x="114" y="654" class="label">Confirmed browser deletion cascades within its project.</text>

  <!-- Outbound SDK provider traffic -->
  <rect x="1102" y="459" width="290" height="138" rx="12" class="card"/>
  <text x="1122" y="488" class="label">EXTERNAL MODEL APIS</text>
  <text x="1122" y="525" class="heading">OpenAI and Anthropic</text>
  <text x="1122" y="553" class="body">Configured model and provider key</text>
  <text x="1122" y="576" class="body">Outbound HTTPS during API runs</text>
  <path d="M1007 538H1101" class="edge"/>

  <!-- Persistence and helpers -->
  <path d="M303 722V762" class="edge"/>
  <path d="M790 700V742H542V762" class="edge"/>
  <text x="609" y="758" class="label">Revision-checked write</text>
  <rect x="76" y="763" width="608" height="143" rx="12" class="storage"/>
  <text x="96" y="797" class="heading">Postgres · internal database</text>
  <text x="96" y="823" class="body">Workspace records · settings, runs and approvals · audit activity</text>
  <text x="96" y="848" class="body">Current document plus three previous versions · 30-day activity window</text>
  <text x="96" y="876" class="label">Persistent volume  /  agentboard_pgdata</text>
  <rect x="752" y="774" width="277" height="113" rx="12" class="card"/>
  <text x="769" y="806" class="heading">Compose helpers</text>
  <text x="769" y="833" class="body">Alembic migrates before startup</text>
  <text x="769" y="858" class="body">Maintenance expires old activity</text>
  <path d="M752 831H685" class="edge dash"/>
  <path d="M76 981H126" class="edge"/>
  <text x="137" y="986" class="body">Runtime or data flow</text>
  <path d="M328 981H378" class="edge dash"/>
  <text x="389" y="986" class="body">Migration or maintenance access</text>
</svg>
