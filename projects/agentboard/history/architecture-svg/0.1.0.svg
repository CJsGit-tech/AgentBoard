<rect width="1120" height="1120" fill="#f4f7fb"/>
<g font-family="Arial, sans-serif" fill="#17304c">
<text x="48" y="52" font-size="28" font-weight="bold">AgentBoard · Local System Architecture</text>
<text x="48" y="82" font-size="16">Draft v0.1.0 · Docker Compose · single builder · manual agent coordination</text>
