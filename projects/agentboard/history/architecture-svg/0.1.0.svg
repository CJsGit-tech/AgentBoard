<text x="88" y="225" font-size="21" font-weight="bold">Desktop browser</text>
<text x="88" y="262" font-size="17">React + TypeScript UI</text>
<text x="88" y="303" font-size="16">Projects · roles · tasks</text>
<text x="88" y="333" font-size="16">Documents · progress</text>
<text x="88" y="383" font-size="15">Unsaved edits kept on error</text>
<text x="88" y="413" font-size="15">Same-origin API requests</text>
