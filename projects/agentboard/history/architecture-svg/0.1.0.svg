<rect x="495" y="325" width="510" height="78" rx="9" fill="white" stroke="#a2bfb5"/>
<text x="515" y="355" font-size="18" font-weight="bold">Application services</text>
<text x="515" y="382" font-size="15">Validation · project isolation · revision checks</text>
<rect x="495" y="439" width="510" height="56" rx="9" fill="white" stroke="#a2bfb5"/>
<text x="515" y="473" font-size="17">SQLite repository · atomic state + activity writes</text>
<path d="M334 254 H495" stroke="#315d86" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="349" y="222" font-size="14">Loopback HTTP</text>
<text x="349" y="242" font-size="13">127.0.0.1:8080</text>
<path d="M750 289 V325 M750 403 V439" stroke="#315d86" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="495" y="568" width="510" height="94" rx="14" fill="#fff5de" stroke="#c6a866"/>
<text x="515" y="598" font-size="19" font-weight="bold">Named volume · agentboard_data</text>
<text x="515" y="626" font-size="16">/data/agentboard.sqlite3 + SQLite journal files</text>
<text x="515" y="648" font-size="14">Persistent local records · backup outside this volume</text>
<path d="M750 495 V568" stroke="#315d86" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="770" y="550" font-size="14">Mounted at /data</text>
<text x="64" y="550" font-size="16" font-weight="bold">Runtime boundary</text>
